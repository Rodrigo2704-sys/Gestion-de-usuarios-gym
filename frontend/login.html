<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP PARA PRODUCCIÓN (Descomentar al publicar en el servidor final) -->
  <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"> -->
  <!-- CSP TEMPORAL PARA DESARROLLO LOCAL -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' http://me.kis.v2.scr.kaspersky-labs.com; connect-src 'self' http: ws:; object-src 'none'; base-uri 'none'; form-action 'self';">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Gimnasio - Iniciar sesión</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="card">
    <h1>Control de Gimnasio</h1>
    <p class="muted">Inicia sesión para continuar</p>

    <div id="alert" class="alert" role="alert" hidden></div>

    <!-- login.js busca este id exacto para controlar el envío -->
    <form id="iniciarsesion" novalidate>
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com" autocomplete="username" maxlength="150" required autofocus>

      <label for="password">Contraseña</label>
      <div class="field">
        <input type="password" id="password" placeholder="********" autocomplete="current-password" maxlength="72" required>
        <button type="button" class="toggle" data-toggle-password="password" aria-label="Mostrar contraseña">Mostrar</button>
      </div>

      <button type="submit" class="btn" id="btn-entrar">Entrar al sistema</button>
    </form>

    <p class="links"><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
    <p class="links">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
  </main>

  <script src="js/api-base.js"></script>
  <script src="js/api-usuarios.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
