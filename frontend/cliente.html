<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Mi membresía</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        [hidden] { display: none !important; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: #fff; padding: 15px 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 25px; }
        #nombre-bienvenida { color: #007bff; font-weight: bold; }
        .acciones { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-logout { background-color: #dc3545; color: #fff; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background-color: #b02a37; }
        .btn-link { background: #fff; color: #007bff; border: 1px solid #007bff; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: .9rem; }
        .btn-link:hover { background: #eaf3ff; }
        button:focus-visible, a:focus-visible { outline: 3px solid rgba(0, 123, 255, .4); outline-offset: 1px; }

        main { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        .card { background: #fff; padding: 22px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h3 { margin-bottom: 15px; color: #2c3e50; }

        .resumen { display: flex; flex-direction: column; gap: 8px; }
        .resumen .plan { font-size: 1.4rem; font-weight: 700; color: #2c3e50; }
        .badge { display: inline-block; align-self: flex-start; padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; }
        .badge.activo { background: #e7f5ec; color: #1b6e3c; }
        .badge.otro { background: #eceff1; color: #546e7a; }
        .detalle { color: #555; }
        .aviso { color: #b3261e; font-weight: 600; }
        .vacio { color: #6c757d; }

        .tabla-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background-color: #343a40; color: #fff; }
        td.vacio { text-align: center; }
        .estado-activo { font-weight: bold; color: #1e7e34; }
        .estado-otro { font-weight: bold; color: #6c757d; }

        .mensaje { padding: 12px 16px; border-radius: 6px; font-size: .95rem; background: #fdecea; color: #b3261e; }
    </style>
</head>
<body>

    <header>
        <div>Hola, <span id="nombre-bienvenida">Cargando...</span></div>
        <div class="acciones">
            <a class="btn-link" href="cambiar-password.html">Cambiar contraseña</a>
            <button type="button" class="btn-logout" id="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main>
        <div id="mensaje" class="mensaje" role="alert" hidden></div>

        <section class="card" aria-labelledby="titulo-actual">
            <h3 id="titulo-actual">Mi membresía</h3>
            <div class="resumen" id="resumen" hidden>
                <span class="badge activo" id="res-estado"></span>
                <span class="plan" id="res-plan"></span>
                <span class="detalle" id="res-fechas"></span>
                <span class="detalle" id="res-dias"></span>
            </div>
            <p class="vacio" id="res-vacio">Cargando tu membresía…</p>
        </section>

        <section class="card" aria-labelledby="titulo-historial">
            <h3 id="titulo-historial">Historial</h3>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Plan</th>
                            <th>Estado</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/api-base.js"></script>
    <script src="js/api-planes.js"></script>
    <script src="js/cliente.js"></script>
</body>
</html>
