<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Gimnasio - Cambiar contraseña</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="card">
    <h1>Cambiar contraseña</h1>
    <p class="muted">Escribe tu contraseña actual y elige una nueva.</p>

    <div id="alert" class="alert" role="alert" hidden></div>

    <form id="cambiar-form" novalidate>
      <label for="current_password">Contraseña actual</label>
      <div class="field">
        <input id="current_password" type="password" autocomplete="current-password" maxlength="72" required autofocus>
        <button type="button" class="toggle" data-toggle-password="current_password" aria-label="Mostrar contraseña">Mostrar</button>
      </div>

      <label for="new_password">Nueva contraseña</label>
      <div class="field">
        <input id="new_password" type="password" autocomplete="new-password" maxlength="72" required>
        <button type="button" class="toggle" data-toggle-password="new_password" aria-label="Mostrar contraseña">Mostrar</button>
      </div>
      <div class="meter" id="meter" data-level="0" aria-hidden="true"><span id="meter-bar"></span></div>
      <span class="meter-label" id="meter-label" aria-live="polite"></span>
      <ul class="rules" id="rules">
        <li data-rule="length">Mínimo 8 caracteres</li>
        <li data-rule="letter">Al menos una letra</li>
        <li data-rule="number">Al menos un número</li>
      </ul>

      <label for="confirm_password">Repite la nueva contraseña</label>
      <div class="field">
        <input id="confirm_password" type="password" autocomplete="new-password" maxlength="72" required>
        <button type="button" class="toggle" data-toggle-password="confirm_password" aria-label="Mostrar contraseña">Mostrar</button>
      </div>

      <button type="submit" class="btn" id="btn-guardar">Guardar contraseña</button>
    </form>

    <p class="links"><a href="cliente.html" id="volver">Volver al inicio</a></p>
  </main>

  <script src="js/api-base.js"></script>
  <script src="js/api-usuarios.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/cambiar-password.js"></script>
</body>
</html>
