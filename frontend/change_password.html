<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="css/password.css">
</head>
<body data-page="change">
  <main class="card">
    <h1>Cambiar contraseña</h1>
    <p class="muted">Por seguridad, al guardar se cerrarán tus otras sesiones abiertas.</p>

    <div id="alert" class="alert" role="alert" hidden></div>

    <form id="change-form" novalidate>
      <label for="current_password">Contraseña actual</label>
      <div class="field">
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="200" required autofocus>
        <button type="button" class="toggle" data-toggle-password="current_password" aria-label="Mostrar contraseña">Mostrar</button>
      </div>

      <label for="new_password">Nueva contraseña</label>
      <div class="field">
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" maxlength="200" required>
        <button type="button" class="toggle" data-toggle-password="new_password" aria-label="Mostrar contraseña">Mostrar</button>
      </div>
      <div class="meter" id="meter" data-level="0" aria-hidden="true"><span id="meter-bar"></span></div>
      <span class="meter-label" id="meter-label" aria-live="polite"></span>
      <ul class="rules" id="rules">
        <li data-rule="length">Mínimo 8 caracteres</li>
        <li data-rule="letter">Al menos una letra</li>
        <li data-rule="number">Al menos un número</li>
      </ul>

      <label for="confirm_password">Repite la nueva contraseña</label>
      <div class="field">
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" maxlength="200" required>
        <button type="button" class="toggle" data-toggle-password="confirm_password" aria-label="Mostrar contraseña">Mostrar</button>
      </div>

      <button type="submit" class="btn" id="submit-btn">Guardar contraseña</button>
    </form>

    <p class="links"><a href="cliente.html" id="volver">Volver al inicio</a></p>
  </main>

  <script src="js/password.js"></script>
</body>
</html>
